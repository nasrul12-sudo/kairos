{% extends "base.html" %}
{% block content %}
<h2>Register</h2>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Register</button>
</form>

<p>Sudah punya akun? <a href="{% url 'users:login' %}?next={{ next }}">Login</a></p>
{% endblock %}
