<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deteksi Penyakit Daun Cabai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .card img { max-height: 300px; object-fit: contain; }
    .spinner-border { width: 3rem; height: 3rem; }
  </style>
</head>
<body class="container py-4">
  <h2 class="text-center mb-4">🌱 Deteksi Penyakit Daun Cabai</h2>

  <form id="leafForm" enctype="multipart/form-data" class="mb-4 text-center">
    <input class="form-control mb-3" type="file" name="image" accept="image/*" required>
    <button class="btn btn-success">Upload & Deteksi</button>
  </form>

  <div id="loading" class="text-center my-3 d-none">
    <div class="spinner-border text-success" role="status"></div>
    <p class="mt-2">Sedang memproses gambar...</p>
  </div>

  <div id="uploadResult" class="row g-3"></div>

  <script>
    const form = document.getElementById("leafForm");
    const preview = document.getElementById("preview");
    const resultDiv = document.getElementById("uploadResult");
    const loading = document.getElementById("loading");

    // preview gambar sebelum upload
    form.image.onchange = () => {
      if (form.image.files[0]) {
        preview.innerHTML = `<img src="${URL.createObjectURL(form.image.files[0])}" 
                              class="img-fluid rounded shadow">`;
      }
    };

    form.onsubmit = async function(e){
      e.preventDefault();
      if (!form.image.files[0]) return;

      resultDiv.innerHTML = "";
      loading.classList.remove("d-none");

      let formData = new FormData();
      formData.append("image", form.image.files[0]);

      try {
        let res = await fetch("/api/v1/leaf/upload-leaf/", {
          method: "POST",
          body: formData
        });
        let data = await res.json();

        if(data.error){
          resultDiv.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
          return;
        }

        resultDiv.innerHTML = `
          <div class="col-md-6">
            <div class="card shadow-sm">
              <div class="card-header">Gambar Asli</div>
              <div class="card-body text-center">
                <img src="${data.original_image}" class="img-fluid rounded">
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card shadow-sm">
              <div class="card-header">Hasil Deteksi</div>
              <div class="card-body text-center">
                <img src="${data.detected_image}" class="img-fluid rounded">
              </div>
            </div>
          </div>
          <div class="col-12">
            <h4 class="mt-4">Prediksi</h4>
            <div class="table-responsive">
              <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                  <tr><th>Label</th><th>Confidence</th><th>BBox</th></tr>
                </thead>
                <tbody>
                  ${data.predictions.map(p => `
                    <tr>
                      <td>${p.label}</td>
                      <td>${(p.confidence * 100).toFixed(2)}%</td>
                      <td>[${p.bbox.join(", ")}]</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
          ${data.analysis.map(a => `
            <div class="col-12">
              <div class="card mt-3 shadow-sm">
                <div class="card-body">
                  <h5 class="card-title text-primary">${a.nama} (conf: ${a.confidence})</h5>
                  <p class="text-muted">${a.deskripsi}</p>
                  <p><strong>Gejala:</strong></p>
                  <ul>${a.gejala.map(g => `<li>${g}</li>`).join("")}</ul>
                  <p><strong>Penanganan:</strong></p>
                  <ul>${a.penanganan.map(p => `<li>${p}</li>`).join("")}</ul>
                </div>
              </div>
            </div>
          `).join("")}
        `;
      } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-danger">Terjadi kesalahan saat upload!</div>`;
        console.error(err);
      } finally {
        loading.classList.add("d-none");
      }
    };
  </script>
</body>
</html>
